[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twod2vr"
version = "2.0.0rc6"
description = "2D2VR: local photos to 3D Gaussian splats and videos to splat videos, for VR, on NVIDIA GPUs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
# The application process deliberately stays light: no torch, no CUDA.
# ML backends run in isolated runtimes managed by twod2vr.runtimes.
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
media = ["imageio-ffmpeg>=0.5"]
dev = ["pytest>=8", "imageio-ffmpeg>=0.5"]

[project.scripts]
2d2vr = "twod2vr.cli:main"

[project.gui-scripts]
2d2vr-gui = "twod2vr.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
