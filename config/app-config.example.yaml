app:
  name: 2D2VR
  version: 2.0.0
  language: en

hardware:
  target_gpu: "NVIDIA GeForce RTX 4080"
  target_vram_gb: 16
  minimum_vram_gb: 8

storage:
  models_dir: "%LOCALAPPDATA%/2D2VR/models"
  jobs_dir: "%LOCALAPPDATA%/2D2VR/jobs"
  cache_dir: "%LOCALAPPDATA%/2D2VR/cache"
  logs_dir: "%LOCALAPPDATA%/2D2VR/logs"

pipeline:
  photo: photo_locked        # Real 3D: SHARP aligned to MoGe-3's measured depth, AI fill of what it hides
  video: splat_video         # every frame made like a Real 3D photo, one .splv file with the sound
  ipd_mm: 63                 # people's eyes are scaled to this distance (real-world size)

player:
  formats: [splat, splv]
  size_control: [A/X smaller, B/Y bigger, stick click reset]

privacy:
  upload_media: false
  telemetry: false
