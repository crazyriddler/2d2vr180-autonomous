name: Integration (real models, CPU)

# Real-model verification on GitHub's Windows runners (internet, no GPU):
# the packaged app installs its runtimes with the bundled uv, downloads the
# models through the model manager and runs real inference on the CPU.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  photo-runtime:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap and build
        shell: pwsh
        run: |
          ./scripts/bootstrap.ps1
          ./scripts/build.ps1
          .venv\Scripts\python.exe -m pip install scikit-image==0.25.2
      - name: Real-model integration (photo runtime)
        shell: pwsh
        env:
          TWOD2VR180_HOME: D:\2d2vr180-home
        run: .venv\Scripts\python.exe scripts\ci_integration.py --app dist\2D2VR180\2d2vr180-cli.exe --runtime photo-cu128 --out D:\ci-out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-photo
          path: |
            D:\ci-out\*.json
            D:\ci-out\*.log
            D:\2d2vr180-home\jobs\*\run_report.json
            D:\2d2vr180-home\jobs\*\export\vr180\*.jpg
            D:\2d2vr180-home\jobs\*\export\vr180\*.png
          if-no-files-found: warn

  video-runtime:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap and build
        shell: pwsh
        run: |
          ./scripts/bootstrap.ps1
          ./scripts/build.ps1
      - name: Install recon3d runtime (install + import smoke only; training needs CUDA)
        shell: pwsh
        env:
          TWOD2VR180_HOME: D:\2d2vr180-home
        run: .venv\Scripts\python.exe scripts\ci_integration.py --app dist\2D2VR180\2d2vr180-cli.exe --runtime recon3d-cu124 --out D:\ci-out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-video
          path: D:\ci-out\*
          if-no-files-found: warn
