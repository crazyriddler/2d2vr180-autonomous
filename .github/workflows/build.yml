name: Build

on:
  workflow_dispatch:
    inputs:
      integration:
        description: "Also run the real-model integration jobs (runtime install, model download, CPU inference)"
        type: boolean
        default: false
      resolve_models:
        description: "Only resolve model metadata (revisions, SHA256, licences) from Hugging Face"
        type: boolean
        default: false
      release_tag:
        description: "Create a release with this tag (e.g. v1.0.0-rc1) from the dispatched commit; -rc tags become pre-releases"
        type: string
        default: ""
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  resolve-models:
    if: github.event_name == 'workflow_dispatch' && inputs.resolve_models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/resolve_models.py | tee resolved-models.json
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-models
          path: resolved-models.json

  test-linux:
    # GPU-free tests: scene I/O, VR180 geometry, media analysis, model manager,
    # job pipeline with a test-only fake worker, GUI offscreen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for Qt (offscreen + Xvfb/Mesa OpenGL)
        run: >
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 xvfb
          libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
          libxcb-xinerama0 libxcb-shape0 libgl1-mesa-dri
      - run: pip install -r requirements-dev.txt
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q
      - name: GUI tests with real OpenGL (Mesa llvmpipe on Xvfb)
        run: QT_QPA_PLATFORM=xcb xvfb-run -a -s "-screen 0 1280x1024x24" python -m pytest -q tests/integration/test_gui.py
      - name: WebXR viewer browser tests (Chrome on Mesa OpenGL)
        run: |
          pip install playwright==1.55.0
          CHROME_PATH=$(which google-chrome) xvfb-run -a -s "-screen 0 1280x1024x24" python -m pytest -q tests/integration/test_webxr_viewer.py

  build-windows:
    # Hosted runners have no NVIDIA GPU: this job proves packaging, launch and
    # error paths only. RTX 4080 gates are recorded in docs/status/gates.json.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Installer smoke test
        shell: pwsh
        run: ./scripts/install-test.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2d2vr180-windows
          path: release/*
          if-no-files-found: error

  release:
    # v*-rc* tags publish a GitHub PRE-release (for owner testing on the target GPU);
    # any other v* tag creates a DRAFT release. Both require docs/status/gates.json:
    # every mandatory gate must pass, or (release candidates only) carry an explicit waiver.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [test-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Acceptance gates
        id: gates
        run: |
          python - <<'PY'
          import json, os, sys
          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              print(f"release tag must start with 'v': {tag}"); sys.exit(1)
          rc = "-rc" in tag
          g = json.load(open("docs/status/gates.json"))
          bad = [f"{x['id']}: {x['status']}" for x in g["gates"]
                 if x["mandatory"] and x["status"] != "pass" and not (rc and x.get("waived_for_rc"))]
          if bad:
              print("Release blocked by gates:\n  " + "\n  ".join(bad)); sys.exit(1)
          waived = [x["id"] for x in g["gates"] if x["mandatory"] and x["status"] != "pass"]
          print("waived for this release candidate:", waived)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"prerelease={'true' if rc else 'false'}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: 2d2vr180-windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: 2D2VR180 ${{ env.RELEASE_TAG }}
          prerelease: ${{ steps.gates.outputs.prerelease == 'true' }}
          draft: ${{ steps.gates.outputs.prerelease != 'true' }}
          files: release/*
          body_path: docs/RELEASE_NOTES.md

  # Real-model verification on GitHub's Windows runners (internet, no GPU): the packaged
  # app installs its runtimes with the bundled uv, downloads the models through the model
  # manager and runs real inference on the CPU.
  integration-photo:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap and build
        shell: pwsh
        run: |
          ./scripts/bootstrap.ps1
          ./scripts/build.ps1
          .venv\Scripts\python.exe -m pip install scikit-image==0.25.2
      - name: Real-model integration (photo runtime)
        shell: pwsh
        env:
          TWOD2VR180_HOME: D:\2d2vr180-home
        run: .venv\Scripts\python.exe scripts\ci_integration.py --app dist\2D2VR180\2d2vr180-cli.exe --runtime photo-cu128 --out D:\ci-out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-photo
          path: D:\ci-out\
          if-no-files-found: warn

  integration-video:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap and build
        shell: pwsh
        run: |
          ./scripts/bootstrap.ps1
          ./scripts/build.ps1
      - name: Install recon3d runtime (install + import smoke only; training needs CUDA)
        shell: pwsh
        env:
          TWOD2VR180_HOME: D:\2d2vr180-home
        run: .venv\Scripts\python.exe scripts\ci_integration.py --app dist\2D2VR180\2d2vr180-cli.exe --runtime recon3d-cu124 --out D:\ci-out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-video
          path: D:\ci-out\*
          if-no-files-found: warn
